<svg width="700" height="180" viewBox="0 0 700 180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="achBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0000"/>
      <stop offset="100%" stop-color="#2a0505"/>
    </linearGradient>
    <filter id="achGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="700" height="180" rx="14" fill="url(#achBg)" stroke="#4d1414"/>
  <text x="26" y="34" font-family="Consolas,monospace" font-weight="bold" font-size="14" fill="#ff3b3b">GITHUB ACHIEVEMENTS &amp; RECOGNITION</text>

  <g font-family="Consolas,monospace" font-size="12" fill="#e5e5e5">
    <g transform="translate(30,55)" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.2s" fill="freeze"/>
      <circle cx="20" cy="20" r="20" fill="#200a0a" stroke="#ff3b3b" filter="url(#achGlow)"/>
      <text x="20" y="26" text-anchor="middle" font-size="18">🦈</text>
      <text x="50" y="16" fill="#ff6b6b" font-weight="bold">Pull Shark</text>
      <text x="50" y="32" fill="#cccccc" font-size="10">Merged pull requests</text>
    </g>

    <g transform="translate(280,55)" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.4s" fill="freeze"/>
      <circle cx="20" cy="20" r="20" fill="#200a0a" stroke="#ff3b3b" filter="url(#achGlow)"/>
      <text x="20" y="26" text-anchor="middle" font-size="18">🎲</text>
      <text x="50" y="16" fill="#ff6b6b" font-weight="bold">YOLO</text>
      <text x="50" y="32" fill="#cccccc" font-size="10">Merged without review</text>
    </g>

    <g transform="translate(500,55)" opacity="0">
      <animate attributeName="opacity" to="1" dur="0.5s" begin="0.6s" fill="freeze"/>
      <circle cx="20" cy="20" r="20" fill="#200a0a" stroke="#ff3b3b" filter="url(#achGlow)"/>
      <text x="20" y="26" text-anchor="middle" font-size="18">⚡</text>
      <text x="50" y="16" fill="#ff6b6b" font-weight="bold">Quickdraw</text>
      <text x="50" y="32" fill="#cccccc" font-size="10">Closed issue/PR fast</text>
    </g>
  </g>

  <line x1="30" y1="115" x2="670" y2="115" stroke="#4d1414"/>

  <g font-family="Consolas,monospace" font-size="12" fill="#e5e5e5" opacity="0">
    <animate attributeName="opacity" to="1" dur="0.5s" begin="0.9s" fill="freeze"/>
    <text x="30" y="140">🏆 TryHackMe: Top 5% ranked &#183; 100+ labs completed</text>
    <text x="30" y="160">🎯 Focus: OWASP Top 10 &#183; Broken Access Control &#183; IDOR &#183; BOLA/BFLA</text>
  </g>
</svg>
